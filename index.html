<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Logic Jigsaw 解題器</title>
<style>
*{box-sizing:border-box}body{font-family:system-ui,sans-serif;margin:0;background:#f2f5fa;color:#253149}main{max-width:1020px;margin:auto;padding:20px}h1{margin-bottom:4px}.layout{display:grid;grid-template-columns:minmax(300px,540px) 1fr;gap:16px}.card{background:white;border-radius:16px;padding:18px;box-shadow:0 3px 15px #0001}.board{display:grid;grid-template-columns:repeat(8,1fr);gap:3px;background:#aab5c5;padding:5px;border-radius:10px}.cell{aspect-ratio:1;border:0;border-radius:4px;background:white;font-size:12px;font-weight:bold;touch-action:none;cursor:pointer}.cell.black{background:#252a33;color:white}.actions{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}button,input,select{font:inherit}button.action{padding:9px 12px;border:1px solid #cdd6e3;border-radius:9px;background:#fff;cursor:pointer}.primary{background:#155ce9!important;color:#fff;border-color:#155ce9!important}input,select{padding:9px;border:1px solid #cdd6e3;border-radius:8px;max-width:190px}.status{padding:12px;border-radius:9px;background:#edf3ff;line-height:1.5}.piece{display:flex;align-items:center;gap:9px;border-bottom:1px solid #e6eaf0;padding:8px 0}.piece input{width:50px;padding:5px}.swatch{width:22px;height:22px;border-radius:4px;flex-shrink:0}p{line-height:1.6;color:#637086}.small{font-size:13px}@media(max-width:750px){.layout{grid-template-columns:1fr}main{padding:12px}.card{padding:14px}}
</style></head><body><main><h1>Logic Jigsaw 解題器</h1><p>在 8×8 棋盤上設定黑色積木位置，產生完整排列解法。</p><div class="layout"><section class="card"><h2>① 題目棋盤</h2><p class="small">點選或拖曳格子設定黑色位置。</p><div id="board" class="board"></div><div class="actions"><input id="name" placeholder="題號，例如 28"><button class="action" id="save">儲存題目</button><select id="saved"><option value="">選擇題目</option></select><button class="action" id="load">載入</button><button class="action" id="delete">刪除</button></div><div class="actions"><button class="action" id="example">第 27 題範例</button><button class="action" id="clear">清空</button><button class="action" id="undo">復原</button></div><div class="actions"><button class="action primary" id="solve">產生解法</button><button class="action" id="edit">返回編輯</button></div><div id="status" class="status" role="status">請先確認積木尺寸。</div><div class="actions" id="nav" hidden><button class="action" id="prev">上一組</button><strong id="counter"></strong><button class="action" id="next">下一組</button></div></section><aside class="card"><h2>② 積木尺寸</h2><p class="small">以下尺寸依封面推估，並非原廠確認數據。請依實際積木修改。黑色積木也會自動驗證形狀。</p><div id="pieces"></div><div class="actions"><button class="action" id="reset">還原尺寸</button></div><p class="small">解法只在本機瀏覽器計算，儲存題目使用瀏覽器 localStorage。支援旋轉，最多顯示 30 組解法。</p></aside></div></main>
<script>
const defaults=[['Y1','黃色大',4,3,'#e3b735',0],['Y2','黃色長',5,2,'#f2cc58',0],['R1','紅色長',1,5,'#b94b51',0],['R2','紅色方',2,2,'#e26b70',0],['W1','白色方',3,3,'#cdd9e8',0],['W2','白色長',2,4,'#e8eef6',0],['B1','藍色長',1,4,'#7c80ce',0],['B2','藍色方',2,3,'#5359ae',0],['K1','黑色單',1,1,'#292c32',1],['K2','黑色短',1,2,'#40444a',1],['K3','黑色長',1,3,'#585c63',1]];
let pieces=[],marks=new Set([5,8,16,24,34,35]),history=[],solutions=[],idx=0,show=false,drag=false,drawBlack=true;
const $=id=>document.getElementById(id);const say=t=>$('status').textContent=t;
function resetPieces(){pieces=defaults.map(([id,name,w,h,color,black])=>({id,name,w,h,color,black}));renderPieces();invalidate()}
function invalidate(){show=false;solutions=[];$('nav').hidden=true;renderBoard()}
function renderBoard(){const b=$('board');b.innerHTML='';for(let i=0;i<64;i++){const c=document.createElement('button');c.className='cell';c.setAttribute('aria-label','第'+(Math.floor(i/8)+1)+'排第'+(i%8+1)+'格');if(show){const p=pieces.find(x=>x.id===solutions[idx][i]);c.style.background=p.color;c.style.color=p.black||p.id[0]==='B'?'white':'#26344a';c.textContent=p.id}else if(marks.has(i)){c.classList.add('black');c.textContent='■'}c.onpointerdown=e=>{if(show)return;e.preventDefault();history.push([...marks]);drawBlack=!marks.has(i);drag=true;paint(i)};c.onpointerenter=()=>{if(drag)paint(i)};b.append(c)}if(show){$('nav').hidden=false;$('counter').textContent=(idx+1)+' / '+solutions.length}}
function paint(i){if(drawBlack)marks.add(i);else marks.delete(i);invalidate()}
window.addEventListener('pointerup',()=>drag=false);
function renderPieces(){const p=$('pieces');p.innerHTML='';pieces.forEach((x,i)=>{const row=document.createElement('div');row.className='piece';const sw=document.createElement('span');sw.className='swatch';sw.style.background=x.color;row.append(sw,document.createTextNode(x.id+' '+x.name+' '));['w','h'].forEach(key=>{const input=document.createElement('input');input.type='number';input.min=1;input.max=8;input.value=x[key];input.title=key==='w'?'寬':'高';input.onchange=()=>{x[key]=Math.max(1,Math.min(8,Number(input.value)||1));invalidate()};row.append(input)});p.append(row)})}
function stored(){try{return JSON.parse(localStorage.getItem('jigsaw-puzzles')||'{}')}catch{return {}}}
function refreshSaved(){const s=$('saved');s.innerHTML='<option value="">選擇題目</option>';Object.keys(stored()).sort().forEach(k=>{const o=document.createElement('option');o.value=k;o.textContent=k;s.append(o)})}
$('save').onclick=()=>{const name=$('name').value.trim();if(!name)return say('請輸入題號。');const d=stored();d[name]=[...marks];localStorage.setItem('jigsaw-puzzles',JSON.stringify(d));refreshSaved();$('saved').value=name;say('已儲存 '+name)};
$('load').onclick=()=>{const v=stored()[$('saved').value];if(!v)return say('請先選擇題目。');history.push([...marks]);marks=new Set(v);$('name').value=$('saved').value;invalidate();say('已載入題目。')};
$('delete').onclick=()=>{const k=$('saved').value;if(!k)return;const d=stored();delete d[k];localStorage.setItem('jigsaw-puzzles',JSON.stringify(d));refreshSaved();say('已刪除題目。')};
$('example').onclick=()=>{history.push([...marks]);marks=new Set([5,8,16,24,34,35]);invalidate();say('已載入第 27 題範例。')};
$('clear').onclick=()=>{history.push([...marks]);marks.clear();invalidate();say('已清空棋盤。')};
$('undo').onclick=()=>{if(!history.length)return;marks=new Set(history.pop());invalidate();say('已復原。')};
$('edit').onclick=()=>{show=false;renderBoard()};
$('prev').onclick=()=>{idx=(idx-1+solutions.length)%solutions.length;renderBoard()};
$('next').onclick=()=>{idx=(idx+1)%solutions.length;renderBoard()};
$('reset').onclick=resetPieces;
$('solve').onclick=()=>{invalidate();const area=pieces.reduce((s,p)=>s+p.w*p.h,0);if(area!==64)return say('積木總面積為 '+area+' 格，不等於棋盤 64 格。請確認積木尺寸。');const black=pieces.filter(p=>p.black).reduce((s,p)=>s+p.w*p.h,0);if(black!==marks.size)return say('黑色積木面積 '+black+' 格，但題目標記 '+marks.size+' 格。請修正。');say('正在搜尋合法解法…');setTimeout(solve,20)};
function solve(){const opts=pieces.map(p=>{let a=[];const seen=new Set();for(const [w,h] of [[p.w,p.h],[p.h,p.w]]){if(seen.has(w+'x'+h))continue;seen.add(w+'x'+h);for(let y=0;y<=8-h;y++)for(let x=0;x<=8-w;x++){let cells=[],valid=true;for(let dy=0;dy<h;dy++)for(let dx=0;dx<w;dx++){const n=(y+dy)*8+x+dx;cells.push(n);if(marks.has(n)!==!!p.black)valid=false}if(valid)a.push(cells)}}return a});
if(opts.some(a=>!a.length))return say('至少一塊積木無法放置，請檢查黑色位置或積木尺寸。');
const byCell=Array.from({length:64},()=>[]);opts.forEach((a,p)=>a.forEach((cells,j)=>cells.forEach(c=>byCell[c].push([p,j]))));
const used=new Set(),occupied=new Uint8Array(64),grid=Array(64).fill(null),limit=30;let nodes=0;
function dfs(){if(solutions.length>=limit||nodes++>1500000)return;if(used.size===pieces.length){if(grid.every(Boolean))solutions.push(grid.slice());return}let best=null,candidates=null;for(let c=0;c<64;c++){if(occupied[c])continue;const candidatesHere=byCell[c].filter(([p,j])=>!used.has(p)&&opts[p][j].every(k=>!occupied[k]));if(!candidatesHere.length)return;if(!candidates||candidatesHere.length<candidates.length){best=c;candidates=candidatesHere;if(candidates.length===1)break}}if(best===null)return;for(const [p,j] of candidates){const cells=opts[p][j];used.add(p);cells.forEach(c=>{occupied[c]=1;grid[c]=pieces[p].id});dfs();cells.forEach(c=>{occupied[c]=0;grid[c]=null});used.delete(p);if(solutions.length>=limit)return}}
dfs();if(solutions.length){idx=0;show=true;renderBoard();say('找到 '+solutions.length+' 組解法'+(nodes>1500000?'（搜尋已達上限）':'')+'。')}else say(nodes>1500000?'搜尋已達上限，尚未找到解法。':'找不到合法解法，請檢查積木尺寸及黑色格子。')}
resetPieces();refreshSaved();say('請確認右側積木尺寸，再設定題目並求解。');
</script></body></html>
